name: Deploy Pages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm test

      # Every published major version is rebuilt from its own tag on every
      # deploy, rather than carried forward from whatever the last deploy
      # happened to upload. GitHub Pages replaces the whole site each time, so
      # a version that is not re-staged here silently disappears - and the
      # promise that v1/ keeps serving forever is the one thing consumers are
      # relying on.
      - name: Build the site and stage every published version
        run: |
          npm run docs
          for tag in $(git tag -l 'v*' | sort -V); do
            major="${tag%%.*}"
            mkdir -p "_site/$major"
            git show "$tag:dist/axi.css" > "_site/$major/axi.css"
            echo "staged $tag -> /$major/axi.css"
            if git show "$tag:dist/accents.css" > "_site/$major/accents.css" 2>/dev/null; then
              echo "staged $tag -> /$major/accents.css"
            else
              rm -f "_site/$major/accents.css"
              echo "no accents.css in $tag (predates the accent list)"
            fi
            # Listed from the tag rather than from themes/ in the working tree:
            # a theme added later must not be looked for in a version that
            # predates it, and one retired later must still be served by the
            # versions that shipped it. A tag with no themes stages none, and
            # leaves no empty directory behind to imply otherwise.
            if themes=$(git ls-tree --name-only "$tag:dist/themes" 2>/dev/null); then
              for file in $themes; do
                mkdir -p "_site/$major/themes"
                git show "$tag:dist/themes/$file" > "_site/$major/themes/$file"
                echo "staged $tag -> /$major/themes/$file"
              done
            fi
          done
          ls -R _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
